info.app:
  name: HMPPS Court Case Enrichment Worker
  version: 1.0

spring:
  application:
    name: hmpps-court-case-enrichment-worker

#  This jackson configuration is only applied for java.util.Date.
#  It is ignored for LocalDateTime, and therefore unnecessary for most projects
#  jackson:
#    date-format: "yyyy-MM-dd HH:mm:ss"

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${hmpps-auth.url}/.well-known/jwks.json

      client:
        provider:
          hmpps-auth:
            token-uri: ${hmpps-auth.url}/oauth/token
        registration:
          offender-search-client:
            provider: hmpps-auth
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            client-id: ${OFFENDER_SEARCH_CLIENT_ID}
            client-secret: ${OFFENDER_SEARCH_CLIENT_SECRET}
          court-case-service-client:
            provider: hmpps-auth
            client-authentication-method: client_secret_basic
            authorization-grant-type: client_credentials
            client-id: ${COURT_CASE_SERVICE_CLIENT_ID}
            client-secret: ${COURT_CASE_SERVICE_CLIENT_SECRET}
          person-record-search-client:
            provider: hmpps-auth
            authorization-grant-type: client_credentials
            client-id: ${PERSON_RECORD_SEARCH_CLIENT_ID}
            client-secret: ${PERSON_RECORD_SEARCH_CLIENT_SECRET}
  http:
    codecs:
      max-in-memory-size: 10MB
  web:
    error:
      include-message: always

server:
  port: 8080
  servlet:
    context-path: /
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: x-forwarded-for
      protocol-header: x-forwarded-proto
      internal-proxies: 10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.1[0-1][0-9]{1}\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}
  shutdown: graceful

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: 'info, health'
  endpoint:
    health:
      cache:
        time-to-live: 2000ms
      show-components: always
      show-details: always
      probes:
        enabled: true
    info:
      cache:
        time-to-live: 2000ms

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

person-record-service:
  base-url: ${PERSON_RECORD_SERVICE_BASE_URL:http://localhost:8091}
  disable-authentication: ${CPR_SERVICE_DISABLE_AUTHENTICATION:false}
  timeout: 10s

court-case-service:
  base-url: ${COURT_CASE_SERVICE_BASE_URL}
  timeout: 10s
  post-enrichment-url: ${COURT_CASE_SERVICE_POST_ENRICHMENT_URL:/enrichment-results}

offender-search:
  base-url: ${OFFENDER_SEARCH_BASE_URL}
  post-match-url: /match
  post-search-url: /search
  disable-authentication: ${OFFENDER_SEARCH_DISABLE_AUTHENTICATION:false}
  timeout: 10s
