---
# Per environment values which override defaults in hmpps-court-case-enrichment-worker/values.yaml

generic-service:
  replicaCount: 2

  ingress:
    host: court-case-enrichment-worker-preprod.hmpps.service.justice.gov.uk
    tlsSecretName: court-probation-preprod-cert-secret
    # modsecurity_enabled: true

  env:
    SPRING_PROFILES_ACTIVE: "preprod"
    DEFENDANT_ENRICHMENT_COURT_CODES: "B01BE,B01BH,B01CE,B01CN,B01DU,B01EF,B01FA,B01GQ,\
      B01GU,B01IX,B01KR,B01LA,B01LY,B01MN,B01ND,B01NM,B01OK,B03AX,B03DE,B03OT,\
      B04BP,B04BQ,B04CO,B04HQ,B04KO,B05BK,B05BW,B05PK,B06AN,B06BV,B06IS,B06MK,\
      B06OJ,B07DM,B07ED,B07FQ,B10BD,B10BF,B10FR,B10JJ,B10JL,B10JQ,B10LX,B10MR,\
      B11JP,B11KF,B12GH,B12LK,B12LT,B12PA,B13CC,B13HD,B13HT,B14AV,B14ET,B14LO,\
      B16BG,B16CJ,B16GB,B16HE,B17JA,B20BL,B20EB,B20EY,B20NQ,B20OQ,B20ZZ,B21DA,\
      B21JI,B22GR,B22HM,B22KS,B22MZ,B22OS,B23HS,B30PG,B30PI,B31IT,B31JV,B32BX,\
      B32HX,B33HU,B33II,B34JS,B34NX,B35CZ,B35HF,B35KE,B36FZ,B36HN,B36JU,B37HI,\
      B40BC,B40IM,B41ME,B41MJ,B41US,B42AZ,B42CM,B42CO,B42MB,B43AJ,B43JC,B43KB,\
      B43KQ,B43LV,B43OX,B44AG,B44BA,B44JK,B44KM,B44MA,B45GC,B45MH,B46DB,B46DH,\
      B46FO,B46IR,B46IU,B46LN,B47CL,B47EC,B47GL,B47HB,B47OV,B50AW,B50BU,B50JO,\
      B50KH,B50NL,B50VR,B52BB,B52CM,B52MY,B52OC,B52OZ,B53DJ,B53DT,B54MW,B54WV,\
      B55IS,B55KL,B55OE,B60ID,B60JE,B60OW,B60WU,B61EH,B61NP,B61WY,B62DC,B62IZ,\
      B62MV,B63AD,B63GN,B63IC,B63IE,B63LW,B63NZ,C20WO"
    APPLICATIONINSIGHTS_CONFIGURATION_FILE: "applicationinsights.dev.json"
    HMPPS_AUTH_URL: "https://sign-in-preprod.hmpps.service.justice.gov.uk/auth"
    PERSON_RECORD_SERVICE_BASE_URL: "https://hmpps-person-record-preprod.hmpps.service.justice.gov.uk"
    COURT_CASE_SERVICE_BASE_URL: "https://court-case-service-preprod.apps.live-1.cloud-platform.service.justice.gov.uk"
    OFFENDER_SEARCH_BASE_URL: "https://probation-offender-search-preprod.hmpps.service.justice.gov.uk"

  scheduledDowntime:
    enabled: true



  allowlist:
    # Configure groups as appropriate to give the minimum ingress access required:
    #   global_protect: devices using the global_protect proxy
    #   moj_cloud_platform: services on Cloud Platform
    # Other IP allowlist groups are here: 
    # https://github.com/ministryofjustice/hmpps-ip-allowlists/blob/main/ip-allowlist-groups.yaml

    groups:
      - global_protect
      - moj_cloud_platform

  # NOTE: Removing ALL allowlist groups will make the application accessible from the internet. 
  #       If you are intending to do this, please ensure you uncomment the 'modsecurity_enabled=true' 
  #       entry in the ingress above. This will enable WAF protection of the endpoint. You will need 
  #       to configure modsecurity rules to suit your needs. Further information can be found here:
  #       https://user-guide.cloud-platform.service.justice.gov.uk/documentation/networking/modsecurity.html#modsecurity-web-application-firewall


# CloudPlatform AlertManager receiver to route prometheus alerts to slack
# See https://user-guide.cloud-platform.service.justice.gov.uk/documentation/monitoring-an-app/how-to-create-alarms.html#creating-your-own-custom-alerts
generic-prometheus-alerts:
  businessHoursOnly: true
  alertSeverity: probation_in_court_alerts_preprod
